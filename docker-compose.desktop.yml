services:
  reasonix-bot:
    # Docker Desktop does not support `network_mode: host`, so the Linux base
    # override is replaced with the default bridge network. The bot only talks to
    # the `reasonix serve` instances it spawns on its own container loopback, so
    # no host port forwarding is required.
    network_mode: bridge
    environment:
      REASONIX_TELEGRAM_CONTAINER: "1"