services:
  reasonix-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reasonix-telegram-bot
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - REASONIX_TELEGRAM_HOME=/app/data
      - REASONIX_TELEGRAM_CONTAINER=1
      # Point the bot at the mounted Reasonix binary and the roots it may serve, e.g.:
      # - REASONIX_SERVE_BINARY=/usr/local/bin/reasonix
      # - REASONIX_ROOTS=/projects/repo-a,/projects/repo-b
    env_file:
      - .env
    volumes:
      - reasonix-bot-data:/app/data
      # Mount the Reasonix binary and the project roots the bot may serve, e.g.:
      # - /usr/local/bin/reasonix:/usr/local/bin/reasonix:ro
      # - /home/you/projects:/projects
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  reasonix-bot-data: